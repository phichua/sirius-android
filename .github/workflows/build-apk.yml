name: Build APK

on:
  push:
    branches: [main]
    # Documentation-only edits do not change the APK.
    paths-ignore:
      - "**.md"
      - ".github/FUNDING.yml"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/sirius-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sirius-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish a release you can install from your phone
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sirius build ${{ github.run_number }}
          body: |
            Standalone Android app for the Hengbot Sirius robot dog.

            Talks straight to the dog over `ws://<ip>:8765` — no laptop needed.
            Open the release on your phone, download the APK and install it
            (Android will ask you to allow installing from this source).
          files: out/*.apk
